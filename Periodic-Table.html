<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interactive Periodic Table — All 118 Elements & Live Bohr Models</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@600;700;800&display=swap');

  :root {
    --bg: #070a13;
    --panel: #0f1626;
    --panel-alt: #162038;
    --border: #253352;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);

    --cat-alkali: #ff4757;
    --cat-alkaline: #ff7f50;
    --cat-transition: #ffbe0b;
    --cat-post: #2ed573;
    --cat-metalloid: #00d2d3;
    --cat-nonmetal: #3b82f6;
    --cat-noble: #a855f7;
    --cat-lanthanide: #ff6b81;
    --cat-actinide: #f43f5e;
    --cat-unknown: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(circle at 50% 0%, #131c36 0%, var(--bg) 65%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* Bouncy Header & Controls */
  header {
    background: rgba(15, 22, 38, 0.85);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 30;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-atom {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, #38bdf8, #a855f7);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
    transition: transform 0.4s var(--bounce);
    cursor: pointer;
  }
  .brand-atom:hover { transform: rotate(180deg) scale(1.15); }

  .brand h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -0.3px;
    background: linear-gradient(90deg, #fff, #93c5fd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .brand span {
    font-size: 0.72rem;
    font-weight: 700;
    color: #38bdf8;
    background: rgba(56, 189, 248, 0.14);
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid rgba(56, 189, 248, 0.35);
  }

  .controls-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }

  .control-group {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    padding: 6px 11px;
    border-radius: 12px;
    transition: transform 0.25s var(--bounce), border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .control-group:hover {
    transform: translateY(-2px);
    border-color: #3b4f7a;
    box-shadow: 0 6px 16px rgba(0,0,0,0.3);
  }

  .control-group label {
    font-size: 0.7rem;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input[type="search"], select {
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 600;
    outline: none;
  }
  select option { background: var(--panel); color: var(--text); }
  input[type="search"] { width: 175px; }

  .temp-control input[type="range"] {
    width: 125px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .temp-readout {
    font-variant-numeric: tabular-nums;
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--accent);
    min-width: 68px;
    text-align: right;
  }

  .bouncy-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 9px;
    cursor: pointer;
    transition: transform 0.28s var(--bounce), background 0.15s ease, border-color 0.15s ease;
  }
  .bouncy-btn:hover {
    transform: scale(1.08) translateY(-1px);
    background: rgba(56, 189, 248, 0.2);
    border-color: var(--accent);
  }
  .bouncy-btn:active { transform: scale(0.92); }
  .bouncy-btn.active {
    background: rgba(56, 189, 248, 0.25);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
  }

  /* Filter Chips */
  .filter-bar {
    padding: 9px 20px;
    background: rgba(11, 16, 29, 0.75);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    transition: transform 0.3s var(--bounce), background 0.15s ease, border-color 0.15s ease, box-shadow 0.2s ease;
    user-select: none;
  }

  .chip:hover {
    transform: translateY(-2px) scale(1.05);
    border-color: #5b729e;
  }
  .chip:active { transform: scale(0.93); }
  .chip.active {
    border-color: #fff;
    background: rgba(56, 189, 248, 0.24);
    box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35);
    transform: scale(1.06);
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 6px currentColor;
  }

  /* Main Layout */
  .workspace {
    display: flex;
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .table-scroll {
    flex: 1;
    overflow: auto;
    padding: 14px 20px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .legend-strip {
    width: 100%;
    max-width: 1380px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 0.76rem;
    color: var(--muted);
    flex-wrap: wrap;
    gap: 8px;
  }

  .state-badges {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .state-badges span { display: inline-flex; align-items: center; gap: 5px; }
  .state-pill {
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 0.68rem;
    font-weight: 800;
    background: rgba(255,255,255,0.09);
  }
  .state-solid { color: #f1f5f9; }
  .state-liquid { color: #38bdf8; }
  .state-gas { color: #fb7185; }
  .state-unknown { color: #94a3b8; }

  .trend-scale {
    display: none;
    align-items: center;
    gap: 8px;
    font-weight: 700;
  }
  .trend-scale.visible { display: flex; }
  .gradient-bar {
    width: 140px;
    height: 10px;
    border-radius: 999px;
    background: linear-gradient(90deg, #1e293b, #0284c7, #38bdf8, #fde047, #ef4444);
    border: 1px solid var(--border);
  }

  /* Periodic Table Grid */
  .ptable {
    display: grid;
    grid-template-columns: 24px repeat(18, minmax(60px, 1fr));
    grid-template-rows: 22px repeat(7, minmax(76px, auto)) 14px repeat(2, minmax(76px, auto));
    gap: 5px;
    width: 100%;
    max-width: 1380px;
  }

  .axis-label {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    color: var(--muted);
    font-weight: 700;
  }

  .series-marker {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1px dashed var(--border);
    border-radius: 10px;
    font-size: 0.68rem;
    color: var(--muted);
    text-align: center;
    padding: 2px;
    background: rgba(255,255,255,0.02);
  }

  /* Bouncy Element Tile with Mini Bohr Ring */
  @keyframes tilePopIn {
    0% { opacity: 0; transform: scale(0.55) translateY(14px); }
    70% { opacity: 1; transform: scale(1.06) translateY(-2px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  @keyframes tileJellyClick {
    0% { transform: scale(1); }
    30% { transform: scale(1.22, 0.86); }
    55% { transform: scale(0.92, 1.12); }
    75% { transform: scale(1.06, 0.97); }
    100% { transform: scale(1); }
  }

  @keyframes waveRipple {
    0% { transform: scale(1); }
    40% { transform: scale(1.16) translateY(-4px); box-shadow: 0 10px 24px rgba(56, 189, 248, 0.5); }
    100% { transform: scale(1); }
  }

  .el-tile {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 4px 5px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    transition: transform 0.35s var(--bounce), box-shadow 0.25s ease, opacity 0.2s ease, border-color 0.2s ease;
    outline: none;
    user-select: none;
    min-height: 76px;
    overflow: hidden;
    animation: tilePopIn 0.45s var(--bounce) backwards;
  }

  .el-tile:hover, .el-tile:focus-visible {
    transform: translateY(-6px) scale(1.13) rotate(-1.5deg);
    z-index: 20;
    box-shadow: 0 14px 28px rgba(0, 0, 0, 0.65), 0 0 18px rgba(56, 189, 248, 0.45);
    border-color: #ffffff;
  }

  .el-tile.jelly-click {
    animation: tileJellyClick 0.48s var(--bounce);
  }

  .el-tile.wave-bounce {
    animation: waveRipple 0.5s var(--bounce);
  }

  .el-tile.selected {
    box-shadow: 0 0 0 2.5px #ffffff, 0 10px 26px rgba(56, 189, 248, 0.6);
    transform: translateY(-3px) scale(1.06);
    z-index: 15;
  }

  .el-tile.compare-selected {
    box-shadow: 0 0 0 2.5px #facc15, 0 10px 24px rgba(250, 204, 21, 0.45);
    z-index: 14;
  }

  .el-tile.dimmed {
    opacity: 0.14;
    filter: grayscale(0.8);
    transform: scale(0.95);
  }

  /* Mini Bohr SVG inside every tile */
  .mini-bohr-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0.42;
    transition: opacity 0.25s ease, transform 0.4s var(--bounce);
  }

  .el-tile:hover .mini-bohr-wrap,
  .el-tile.selected .mini-bohr-wrap,
  body.bohr-focus .mini-bohr-wrap {
    opacity: 0.88;
    transform: scale(1.08);
  }

  body.bohr-focus .symbol {
    font-size: 0.92rem;
    opacity: 0.92;
  }

  .tile-top {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.63rem;
    line-height: 1;
  }

  .atomic-num { font-weight: 800; opacity: 0.95; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

  .phase-tag {
    font-size: 0.56rem;
    font-weight: 800;
    padding: 1px 4px;
    border-radius: 4px;
    background: rgba(0,0,0,0.5);
  }

  .symbol {
    position: relative;
    z-index: 2;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.15rem;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.4px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.85);
    transition: font-size 0.2s ease;
  }

  .tile-bottom {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .el-name {
    font-size: 0.56rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0.92;
    text-shadow: 0 1px 3px rgba(0,0,0,0.85);
  }

  .el-sub {
    font-size: 0.53rem;
    opacity: 0.78;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 3px rgba(0,0,0,0.85);
  }

  /* Category Tints */
  .cat-alkali      { background: linear-gradient(145deg, rgba(255,71,87,0.32), rgba(255,71,87,0.12)); border-color: rgba(255,71,87,0.6); }
  .cat-alkaline    { background: linear-gradient(145deg, rgba(255,127,80,0.32), rgba(255,127,80,0.12)); border-color: rgba(255,127,80,0.6); }
  .cat-transition  { background: linear-gradient(145deg, rgba(255,190,11,0.28), rgba(255,190,11,0.10)); border-color: rgba(255,190,11,0.55); }
  .cat-post        { background: linear-gradient(145deg, rgba(46,213,115,0.28), rgba(46,213,115,0.10)); border-color: rgba(46,213,115,0.55); }
  .cat-metalloid   { background: linear-gradient(145deg, rgba(0,210,211,0.30), rgba(0,210,211,0.11)); border-color: rgba(0,210,211,0.58); }
  .cat-nonmetal    { background: linear-gradient(145deg, rgba(59,130,246,0.34), rgba(59,130,246,0.13)); border-color: rgba(59,130,246,0.62); }
  .cat-noble       { background: linear-gradient(145deg, rgba(168,85,247,0.34), rgba(168,85,247,0.13)); border-color: rgba(168,85,247,0.62); }
  .cat-lanthanide  { background: linear-gradient(145deg, rgba(255,107,129,0.30), rgba(255,107,129,0.11)); border-color: rgba(255,107,129,0.58); }
  .cat-actinide    { background: linear-gradient(145deg, rgba(244,63,94,0.30), rgba(244,63,94,0.11)); border-color: rgba(244,63,94,0.58); }
  .cat-unknown     { background: linear-gradient(145deg, rgba(100,116,139,0.28), rgba(100,116,139,0.11)); border-color: rgba(100,116,139,0.55); }

  /* Floating Click Particle Sparkles */
  .spark-particle {
    position: fixed;
    pointer-events: none;
    border-radius: 50%;
    z-index: 999;
    animation: sparkFly 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes sparkFly {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  /* Inspector Drawer */
  .inspector {
    width: 410px;
    max-width: 100vw;
    background: rgba(15, 22, 38, 0.96);
    backdrop-filter: blur(16px);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    transition: transform 0.35s var(--bounce);
  }

  .inspector.closed {
    display: none;
  }

  .inspector-header {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .hero-badge {
    width: 66px;
    height: 66px;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1.5px solid rgba(255,255,255,0.3);
    flex-shrink: 0;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    transition: transform 0.35s var(--bounce);
    cursor: pointer;
  }
  .hero-badge:hover { transform: scale(1.1) rotate(-4deg); }
  .hero-badge .num { font-size: 0.75rem; font-weight: 800; }
  .hero-badge .sym { font-family: 'Space Grotesk', sans-serif; font-size: 1.7rem; font-weight: 800; line-height: 1.05; }

  .hero-title { flex: 1; }
  .hero-title h2 { font-family: 'Space Grotesk', sans-serif; font-size: 1.3rem; font-weight: 800; }
  .hero-title .cat-label {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 2px;
    font-weight: 600;
  }

  .inspector-actions {
    display: flex;
    gap: 6px;
  }

  .inspector-body {
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .summary-text {
    font-size: 0.84rem;
    line-height: 1.5;
    color: #cbd5e1;
    background: var(--panel-alt);
    padding: 11px 13px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }

  /* Interactive Bohr Sandbox Card */
  .bohr-box {
    background: radial-gradient(circle at 50% 50%, #10192e 0%, #060911 100%);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  .bohr-toolbar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    font-size: 0.72rem;
    color: var(--muted);
    font-weight: 700;
  }

  .shell-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: center;
    margin-top: 8px;
  }

  .shell-pill {
    background: rgba(56, 189, 248, 0.14);
    border: 1px solid rgba(56, 189, 248, 0.35);
    color: #bae6fd;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.25s var(--bounce), background 0.15s ease;
  }
  .shell-pill:hover, .shell-pill.active {
    transform: scale(1.12);
    background: rgba(56, 189, 248, 0.35);
    color: #fff;
    border-color: #fff;
  }

  .bohr-caption {
    font-size: 0.74rem;
    color: var(--muted);
    margin-top: 8px;
    text-align: center;
    font-weight: 600;
  }

  .prop-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .prop-card {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    transition: transform 0.25s var(--bounce), border-color 0.2s ease;
  }
  .prop-card:hover {
    transform: translateY(-2px) scale(1.02);
    border-color: #475d8a;
  }
  .prop-card.full { grid-column: 1 / -1; }

  .prop-label {
    font-size: 0.66rem;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
    letter-spacing: 0.4px;
  }

  .prop-val {
    font-size: 0.86rem;
    font-weight: 700;
    margin-top: 2px;
    word-break: break-word;
  }

  /* Comparison Table */
  .compare-panel {
    background: var(--panel-alt);
    border: 1.5px solid #facc15;
    border-radius: 12px;
    padding: 10px;
  }
  .compare-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 0.8rem;
    font-weight: 800;
    color: #fef08a;
  }
  .compare-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.75rem;
  }
  .compare-table th, .compare-table td {
    padding: 5px 6px;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }
  .compare-table th { color: var(--muted); font-weight: 700; }

  @keyframes spinOrbit {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes spinOrbitReverse {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
  }

  .orbit-ring {
    transform-origin: 120px 120px;
    animation: spinOrbit linear infinite;
  }
  .orbit-ring.reverse {
    animation-name: spinOrbitReverse;
  }
  .orbit-ring.paused {
    animation-play-state: paused;
  }

  /* Subtle spin on hovered tile mini Bohr */
  .el-tile:hover .mini-orbit {
    transform-origin: 32px 32px;
    animation: spinOrbit 5s linear infinite;
  }

  @media (max-width: 960px) {
    .inspector {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      z-index: 50;
      box-shadow: -12px 0 36px rgba(0,0,0,0.8);
    }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-atom" id="waveBtn" title="Trigger Bouncy Wave Across All 118 Elements!">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
        <circle cx="12" cy="12" r="2.5" fill="#fff"/>
        <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(30 12 12)"/>
        <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-30 12 12)"/>
        <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(90 12 12)"/>
      </svg>
    </div>
    <h1>Periodic Table</h1>
    <span>118 Bohr Models</span>
  </div>

  <div class="controls-bar">
    <div class="control-group">
      <label for="searchInput">Search</label>
      <input id="searchInput" type="search" placeholder="Name, symbol, or # (Au, 79)" autocomplete="off" />
    </div>

    <div class="control-group">
      <label for="trendSelect">View Mode</label>
      <select id="trendSelect">

function computeShells(z, configStr) {
  const NOBLES = {
    He: [2],
    Ne: [2, 8],
    Ar: [2, 8, 8],
    Kr: [2, 8, 18, 8],
    Xe: [2, 8, 18, 18, 8],
    Rn: [2, 8, 18, 32, 18, 8]
  };
  const shells = [0, 0, 0, 0, 0, 0, 0];
  const coreMatch = configStr.match(/^\[(He|Ne|Ar|Kr|Xe|Rn)\]/);
  if (coreMatch) {
    NOBLES[coreMatch[1]].forEach((cnt, idx) => { shells[idx] = cnt; });
  }
  const rest = configStr.replace(/^\[[A-Za-z]+\]\s*/, "");
  const parts = rest.split(/\s+/).filter(Boolean);
  for (const p of parts) {
    const m = p.match(/^(\d)[spdfg](\d+)$/);
    if (m) {
      const n = parseInt(m[1], 10) - 1;
      const cnt = parseInt(m[2], 10);
      shells[n] += cnt;
    }
  }
  while (shells.length > 1 && shells[shells.length - 1] === 0) {
    shells.pop();
  }
  return shells;
}

// Sound Effects Engine via Tone.js (zero external audio URLs)
let synth = null;
function playElementNote(z, duration = "16n") {
  if (!state.soundEnabled || typeof Tone === "undefined") return;
  try {
    if (Tone.context.state !== "running") {
      Tone.start();
    }
    if (!synth) {
      synth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "triangle" },
        envelope: { attack: 0.01, decay: 0.18, sustain: 0.05, release: 0.35 }
      }).toDestination();
      synth.volume.value = -14;
    }
    // Map atomic number onto a pleasant pentatonic scale across octaves
    const pentatonic = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];
    const freq = pentatonic[z % pentatonic.length] * (1 + ((z % 3) * 0.25));
    synth.triggerAttackRelease(freq, duration);
  } catch (err) {
    // Graceful fallback if audio context blocked
  }
}

function getGridPosition(el) {
  if (el.z >= 57 && el.z <= 71) {
    return { row: 10, col: (el.z - 57) + 4 };
  }
  if (el.z >= 89 && el.z <= 103) {
    return { row: 11, col: (el.z - 89) + 4 };
  }
  return { row: el.period + 1, col: el.group + 1 };
}

function getPhaseAtTemp(el, tempK) {
  if (el.melt === null && el.boil === null) return "unknown";
  if (el.boil !== null && tempK >= el.boil) return "gas";
  if (el.melt !== null && tempK >= el.melt) return "liquid";
  if (el.melt !== null && tempK < el.melt) return "solid";
  if (el.boil !== null && tempK < el.boil) return "solid";
  return "unknown";
}

function formatTemp(kelvin, unit = state.tempUnit) {
  if (kelvin === null || kelvin === undefined) return "Unknown";
  if (unit === "C") return `${(kelvin - 273.15).toFixed(1)} °C`;
  if (unit === "F") return `${((kelvin - 273.15) * 9 / 5 + 32).toFixed(1)} °F`;
  return `${Math.round(kelvin)} K`;
}

function getTrendRange(prop) {
  const vals = ELEMENTS.map(e => e[prop]).filter(v => typeof v === "number" && !isNaN(v));
  return { min: Math.min(...vals), max: Math.max(...vals) };
}

function interpolateHeatColor(t) {
  const stops = [
    [30, 41, 59],
    [2, 132, 199],
    [56, 189, 248],
    [250, 204, 21],
    [239, 68, 68]
  ];
  const scaled = Math.max(0, Math.min(1, t)) * (stops.length - 1);
  const idx = Math.floor(scaled);
  const frac = scaled - idx;
  const c1 = stops[idx];
  const c2 = stops[Math.min(stops.length - 1, idx + 1)];
  const r = Math.round(c1[0] + (c2[0] - c1[0]) * frac);
  const g = Math.round(c1[1] + (c2[1] - c1[1]) * frac);
  const b = Math.round(c1[2] + (c2[2] - c1[2]) * frac);
  return `rgba(${r}, ${g}, ${b}, 0.56)`;
}

/**
 * Generates a crisp, lightweight SVG Bohr model for every single one of the 118 tiles
 */
function buildMiniBohrSVG(el) {
  const cx = 32, cy = 32;
  const numShells = el.shells.length;
  const maxR = 28;
  const minR = 8;
  const step = numShells > 1 ? (maxR - minR) / (numShells - 1) : 0;
  const catColor = CATEGORIES[el.category].color;

  let svg = `<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">`;
  svg += `<circle cx="${cx}" cy="${cy}" r="3.2" fill="${catColor}" opacity="0.85" />`;

  el.shells.forEach((eCount, idx) => {
    const r = minR + idx * step;
    svg += `<g class="mini-orbit">`;
    svg += `<circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="0.7" />`;

    // Render all electrons on outer/valence shells and sampled crisp dots on dense inner shells for visual clarity
    const renderDots = Math.min(eCount, idx === numShells - 1 ? 18 : 12);
    for (let i = 0; i < renderDots; i++) {
      const angle = (2 * Math.PI * i) / renderDots - Math.PI / 2;
      const ex = cx + r * Math.cos(angle);
      const ey = cy + r * Math.sin(angle);
      const isValence = idx === numShells - 1;
      svg += `<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="${isValence ? 1.55 : 1.15}" fill="${isValence ? '#7dd3fc' : '#e2e8f0'}" />`;
    }
    svg += `</g>`;
  });

  svg += `</svg>`;
  return svg;
}

/**
 * Creates a burst of glowing particles when clicking an element
 */
function spawnSparkles(x, y, color) {
  const count = 12;
  for (let i = 0; i < count; i++) {
    const p = document.createElement("div");
    p.className = "spark-particle";
    const size = 4 + Math.random() * 5;
    const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
    const dist = 28 + Math.random() * 44;
    p.style.width = `${size}px`;
    p.style.height = `${size}px`;
    p.style.left = `${x - size / 2}px`;
    p.style.top = `${y - size / 2}px`;
    p.style.background = i % 2 === 0 ? color : "#38bdf8";
    p.style.boxShadow = `0 0 8px ${color}`;
    p.style.setProperty("--dx", `${Math.cos(angle) * dist}px`);
    p.style.setProperty("--dy", `${Math.sin(angle) * dist}px`);
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 660);
  }
}

/**
 * Triggers a playful spring wave across the periodic table from an origin coordinate
 */
function triggerWaveBounce(originRow = 5, originCol = 10) {
  playElementNote(originRow * 3 + originCol, "8n");
  ELEMENTS.forEach(el => {
    const pos = getGridPosition(el);
    const tile = tileMap.get(el.z);
    const dist = Math.hypot(pos.row - originRow, pos.col - originCol);
    setTimeout(() => {
      tile.classList.remove("wave-bounce");
      void tile.offsetWidth;
      tile.classList.add("wave-bounce");
    }, dist * 26);
  });
}

function buildFilterChips() {
  const bar = document.getElementById("filterBar");
  bar.innerHTML = "";

  Object.entries(CATEGORIES).forEach(([key, info]) => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.dataset.cat = key;
    chip.innerHTML = `<span class="dot" style="background:${info.color};color:${info.color}"></span>${info.label}`;
    chip.addEventListener("click", () => {
      state.activeCategory = state.activeCategory === key ? null : key;
      playElementNote(Object.keys(CATEGORIES).indexOf(key) * 2 + 1);
      updateFilterChips();
      renderTiles();
    });
    bar.appendChild(chip);
  });

  const sep = document.createElement("span");
  sep.style.cssText = "width:1px;height:18px;background:var(--border);margin:0 3px;";
  bar.appendChild(sep);

  ["s", "p", "d", "f"].forEach((blk, idx) => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.dataset.blk = blk;
    chip.innerHTML = `<span class="dot" style="background:${BLOCK_COLORS[blk]};color:${BLOCK_COLORS[blk]}"></span>${blk}-block`;
    chip.addEventListener("click", () => {
      state.activeBlock = state.activeBlock === blk ? null : blk;
      playElementNote(idx * 3 + 5);
      updateFilterChips();
      renderTiles();
    });
    bar.appendChild(chip);
  });

  const sep2 = document.createElement("span");
  sep2.style.cssText = "width:1px;height:18px;background:var(--border);margin:0 3px;";
  bar.appendChild(sep2);

  [
    { id: "solid", label: "Solid" },
    { id: "liquid", label: "Liquid" },
    { id: "gas", label: "Gas" }
  ].forEach((ph, idx) => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.dataset.phase = ph.id;
    chip.textContent = ph.label;
    chip.addEventListener("click", () => {
      state.activePhaseFilter = state.activePhaseFilter === ph.id ? null : ph.id;
      playElementNote(idx * 4 + 2);
      updateFilterChips();
      renderTiles();
    });
    bar.appendChild(chip);
  });
}

function updateFilterChips() {
  document.querySelectorAll("#filterBar .chip").forEach(chip => {
    if (chip.dataset.cat) {
      chip.classList.toggle("active", state.activeCategory === chip.dataset.cat);
    } else if (chip.dataset.blk) {
      chip.classList.toggle("active", state.activeBlock === chip.dataset.blk);
    } else if (chip.dataset.phase) {
      chip.classList.toggle("active", state.activePhaseFilter === chip.dataset.phase);
    }
  });
}

function buildGrid() {
  const ptable = document.getElementById("ptable");
  ptable.innerHTML = "";

  for (let g = 1; g <= 18; g++) {
    const lbl = document.createElement("div");
    lbl.className = "axis-label";
    lbl.style.gridRow = 1;
    lbl.style.gridColumn = g + 1;
    lbl.textContent = g;
    ptable.appendChild(lbl);
  }

  for (let p = 1; p <= 7; p++) {
    const lbl = document.createElement("div");
    lbl.className = "axis-label";
    lbl.style.gridRow = p + 1;
    lbl.style.gridColumn = 1;
    lbl.textContent = p;
    ptable.appendChild(lbl);
  }

  const lnMarker = document.createElement("div");
  lnMarker.className = "series-marker";
  lnMarker.style.gridRow = 7;
  lnMarker.style.gridColumn = 4;
  lnMarker.innerHTML = "<strong>57–71</strong><span>Ln</span>";
  ptable.appendChild(lnMarker);

  const anMarker = document.createElement("div");
  anMarker.className = "series-marker";
  anMarker.style.gridRow = 8;
  anMarker.style.gridColumn = 4;
  anMarker.innerHTML = "<strong>89–103</strong><span>An</span>";
  ptable.appendChild(anMarker);

  const lnRowLbl = document.createElement("div");
  lnRowLbl.className = "axis-label";
  lnRowLbl.style.gridRow = 10;
  lnRowLbl.style.gridColumn = "2 / 4";
  lnRowLbl.textContent = "Lanthanides";
  ptable.appendChild(lnRowLbl);

  const anRowLbl = document.createElement("div");
  anRowLbl.className = "axis-label";
  anRowLbl.style.gridRow = 11;
  anRowLbl.style.gridColumn = "2 / 4";
  anRowLbl.textContent = "Actinides";
  ptable.appendChild(anRowLbl);

  ELEMENTS.forEach(el => {
    const pos = getGridPosition(el);
    gridCoords.set(`${pos.row},${pos.col}`, el.z);

    const tile = document.createElement("div");
    tile.className = `el-tile cat-${el.category}`;
    tile.style.gridRow = pos.row;
    tile.style.gridColumn = pos.col;
    // Staggered spring entrance animation
    tile.style.animationDelay = `${(pos.row + pos.col) * 18}ms`;
    tile.tabIndex = 0;
    tile.setAttribute("role", "gridcell");
    tile.dataset.z = el.z;

    tile.innerHTML = `
      <div class="mini-bohr-wrap">${buildMiniBohrSVG(el)}</div>
      <div class="tile-top">
        <span class="atomic-num">${el.z}</span>
        <span class="phase-tag">S</span>
      </div>
      <div class="symbol">${el.symbol}</div>
      <div class="tile-bottom">
        <div class="el-name">${el.name}</div>
        <div class="el-sub">${el.shells.join("-")}</div>
      </div>
    `;

    tile.addEventListener("click", ev => {
      tile.classList.remove("jelly-click");
      void tile.offsetWidth;
      tile.classList.add("jelly-click");
      spawnSparkles(ev.clientX, ev.clientY, CATEGORIES[el.category].color);
      playElementNote(el.z);
      state.highlightedShell = null;
      selectElement(el.z, true);
    });

    tile.addEventListener("keydown", e => handleTileKeydown(e, pos));

    ptable.appendChild(tile);
    tileMap.set(el.z, tile);
  });
}

function renderTiles() {
  const q = state.search.trim().toLowerCase();
  const trendScale = document.getElementById("trendScale");
  const trendMin = document.getElementById("trendMin");
  const trendMax = document.getElementById("trendMax");

  const trendProps = {
    electronegativity: { key: "en", unit: "" },
    radius: { key: "radius", unit: " pm" },
    ionization: { key: "ie", unit: " eV" },
    density: { key: "density", unit: " g/cm³" }
  };

  let range = null;
  if (trendProps[state.colorMode]) {
    const propKey = trendProps[state.colorMode].key;
    range = getTrendRange(propKey);
    trendScale.classList.add("visible");
    trendMin.textContent = `${range.min}${trendProps[state.colorMode].unit}`;
    trendMax.textContent = `${range.max}${trendProps[state.colorMode].unit}`;
  } else {
    trendScale.classList.remove("visible");
  }

  ELEMENTS.forEach(el => {
    const tile = tileMap.get(el.z);
    const phase = getPhaseAtTemp(el, state.tempK);

    const phaseTag = tile.querySelector(".phase-tag");
    const phaseMap = {
      solid:  { code: "S", cls: "state-solid" },
      liquid: { code: "L", cls: "state-liquid" },
      gas:    { code: "G", cls: "state-gas" },
      unknown:{ code: "?", cls: "state-unknown" }
    };
    phaseTag.textContent = phaseMap[phase].code;
    phaseTag.className = `phase-tag ${phaseMap[phase].cls}`;

    const subEl = tile.querySelector(".el-sub");
    tile.style.background = "";
    tile.style.borderColor = "";

    if (state.colorMode === "category") {
      subEl.textContent = `${el.mass} • [${el.shells.join(",")}]`;
    } else if (state.colorMode === "block") {
      subEl.textContent = `${el.block}-block`;
      tile.style.background = `linear-gradient(145deg, ${BLOCK_COLORS[el.block]}48, ${BLOCK_COLORS[el.block]}1a)`;
      tile.style.borderColor = BLOCK_COLORS[el.block];
    } else if (state.colorMode === "phase") {
      subEl.textContent = phase.toUpperCase();
      const pColors = {
        solid: "#64748b",
        liquid: "#0284c7",
        gas: "#dc2626",
        unknown: "#334155"
      };
      tile.style.background = `${pColors[phase]}66`;
      tile.style.borderColor = pColors[phase];
    } else if (state.colorMode === "shells") {
      const cnt = el.shells.length;
      subEl.textContent = `${cnt} ${cnt === 1 ? "Shell" : "Shells"}`;
      const norm = (cnt - 1) / 6;
      tile.style.background = interpolateHeatColor(norm);
      tile.style.borderColor = "rgba(255,255,255,0.28)";
    } else if (trendProps[state.colorMode]) {
      const propKey = trendProps[state.colorMode].key;
      const val = el[propKey];
      if (val !== null && val !== undefined) {
        subEl.textContent = val;
        const norm = propKey === "density"
          ? (Math.log10(val + 0.0001) - Math.log10(range.min + 0.0001)) /
            (Math.log10(range.max + 0.0001) - Math.log10(range.min + 0.0001))
          : (val - range.min) / (range.max - range.min);
        tile.style.background = interpolateHeatColor(norm);
        tile.style.borderColor = "rgba(255,255,255,0.25)";
      } else {
        subEl.textContent = "—";
        tile.style.background = "rgba(15, 23, 42, 0.7)";
      }
    }

    let matches = true;
    if (q) {
      const isNum = /^\d+$/.test(q);
      if (isNum) {
        matches = String(el.z) === q || String(el.z).startsWith(q);
      } else {
        matches = el.name.toLowerCase().includes(q) || el.symbol.toLowerCase().includes(q);
      }
    }
    if (matches && state.activeCategory) {
      matches = el.category === state.activeCategory;
    }
    if (matches && state.activeBlock) {
      matches = el.block === state.activeBlock;
    }
    if (matches && state.activePhaseFilter) {
      matches = phase === state.activePhaseFilter;
    }

    tile.classList.toggle("dimmed", !matches);
    tile.classList.toggle("selected", el.z === state.selectedZ);
    tile.classList.toggle("compare-selected", el.z === state.compareZ && state.compareZ !== state.selectedZ);
  });
}

function selectElement(z, openDrawer = true) {
  state.selectedZ = z;
  const el = ELEMENTS[z - 1];
  const inspector = document.getElementById("inspector");
  if (openDrawer) {
    inspector.classList.remove("closed");
  }

  const badge = document.getElementById("insBadge");
  badge.className = `hero-badge cat-${el.category}`;
  document.getElementById("insNum").textContent = el.z;
  document.getElementById("insSym").textContent = el.symbol;
  document.getElementById("insName").textContent = el.name;
  document.getElementById("insCat").textContent = `${CATEGORIES[el.category].label} • ${el.block}-block`;
  document.getElementById("insSummary").textContent = el.summary;

  const cmpBtn = document.getElementById("compareBtn");
  cmpBtn.classList.toggle("active", state.compareZ !== null);
  cmpBtn.textContent = state.compareZ === el.z ? "Pinned" : (state.compareZ ? "Comparing" : "Compare");

  renderBohrModel(el);
  renderProperties(el);
  renderComparison();
  renderTiles();
}

function renderBohrModel(el) {
  const svg = document.getElementById("bohrSvg");
  const pillsContainer = document.getElementById("shellPills");
  const cx = 120, cy = 120;
  const catColor = CATEGORIES[el.category].color;

  let markup = `
    <defs>
      <radialGradient id="nucGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
        <stop offset="40%" stop-color="${catColor}" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="${catColor}" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="${cx}" cy="${cy}" r="26" fill="url(#nucGlow)" opacity="0.55" />
    <circle cx="${cx}" cy="${cy}" r="17" fill="${catColor}" stroke="#fff" stroke-width="1.2" />
    <text x="${cx}" y="${cy + 4.5}" text-anchor="middle" fill="#fff" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="800">${el.symbol}</text>
  `;

  const numShells = el.shells.length;
  const maxRadius = 106;
  const minRadius = 31;
  const step = numShells > 1 ? (maxRadius - minRadius) / (numShells - 1) : 0;

  el.shells.forEach((eCount, idx) => {
    const r = minRadius + idx * step;
    const baseDuration = (9 + idx * 4.5) / state.orbitSpeedMultiplier;
    const isHighlighted = state.highlightedShell === idx;
    const isDimmed = state.highlightedShell !== null && !isHighlighted;
    const isValence = idx === numShells - 1;

    const ringClasses = [
      "orbit-ring",
      idx % 2 === 1 ? "reverse" : "",
      state.bohrPaused ? "paused" : ""
    ].filter(Boolean).join(" ");

    markup += `<g class="${ringClasses}" style="animation-duration:${baseDuration.toFixed(2)}s; opacity:${isDimmed ? 0.2 : 1};">`;
    markup += `<circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="none" stroke="${isHighlighted ? '#facc15' : 'rgba(148,163,184,0.34)'}" stroke-width="${isHighlighted ? 2 : 1.1}" stroke-dasharray="${isValence ? 'none' : '3 2'}" />`;

    for (let i = 0; i < eCount; i++) {
      const angle = (2 * Math.PI * i) / eCount - Math.PI / 2;
      const ex = cx + r * Math.cos(angle);
      const ey = cy + r * Math.sin(angle);
      const eColor = isHighlighted ? "#facc15" : (isValence ? "#38bdf8" : "#cbd5e1");
      const eRadius = isHighlighted ? 3.8 : (isValence ? 3.1 : 2.5);
      markup += `<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="${eRadius}" fill="${eColor}" />`;
    }
    markup += `</g>`;
  });

  svg.innerHTML = markup;

  // Interactive Shell Pills
  pillsContainer.innerHTML = el.shells.map((cnt, idx) => `
    <button class="shell-pill ${state.highlightedShell === idx ? 'active' : ''}" data-shell="${idx}">
      ${SHELL_NAMES[idx]}: ${cnt}e⁻
    </button>
  `).join("");

  pillsContainer.querySelectorAll(".shell-pill").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = parseInt(btn.dataset.shell, 10);
      state.highlightedShell = state.highlightedShell === idx ? null : idx;
      playElementNote(el.z + idx * 2);
      renderBohrModel(el);
    });
  });

  document.getElementById("bohrCaption").textContent =
    `Total Electrons: ${el.z} • Valence Shell: ${el.shells[el.shells.length - 1]}e⁻ (Click a shell pill to isolate)`;
}

function renderProperties(el) {
  const phaseNow = getPhaseAtTemp(el, state.tempK);
  const props = [
    { label: "Atomic Mass", val: `${el.mass} u` },
    { label: `Phase at ${formatTemp(state.tempK)}`, val: phaseNow.toUpperCase() },
    { label: "Group / Period", val: `Group ${el.group}, Period ${el.period}` },
    { label: "Block & Shells", val: `${el.block}-block (${el.shells.length} shells)` },
    { label: "Melting Point", val: formatTemp(el.melt) },
    { label: "Boiling Point", val: formatTemp(el.boil) },
    { label: "Density (STP)", val: el.density !== null ? `${el.density} g/cm³` : "Unknown" },
    { label: "Electronegativity", val: el.en !== null ? `${el.en} (Pauling)` : "N/A" },
    { label: "Atomic Radius", val: el.radius !== null ? `${el.radius} pm` : "Unknown" },
    { label: "Ionization Energy", val: el.ie !== null ? `${el.ie} eV` : "Unknown" },
    { label: "Electron Configuration", val: el.config, full: true },
    { label: "Discovery", val: el.discovery, full: true }
  ];

  const grid = document.getElementById("propGrid");
  grid.innerHTML = props.map(p => `
    <div class="prop-card ${p.full ? "full" : ""}">
      <div class="prop-label">${p.label}</div>
      <div class="prop-val">${p.val}</div>
    </div>
  `).join("");
}

function renderComparison() {
  const container = document.getElementById("compareContainer");
  const table = document.getElementById("compareTable");

  if (state.compareZ === null || state.compareZ === state.selectedZ) {
    container.style.display = "none";
    return;
  }

  const a = ELEMENTS[state.compareZ - 1];
  const b = ELEMENTS[state.selectedZ - 1];
  container.style.display = "block";

  const rows = [
    ["Atomic #", a.z, b.z],
    ["Mass (u)", a.mass, b.mass],
    ["Shells", a.shells.join("-"), b.shells.join("-")],
    ["Category", CATEGORIES[a.category].label, CATEGORIES[b.category].label],
    ["Melt", formatTemp(a.melt), formatTemp(b.melt)],
    ["Boil", formatTemp(a.boil), formatTemp(b.boil)],
    ["Density", a.density ?? "—", b.density ?? "—"],
    ["Electroneg.", a.en ?? "—", b.en ?? "—"],
    ["Radius (pm)", a.radius ?? "—", b.radius ?? "—"]
  ];

  table.innerHTML = `
    <thead>
      <tr>
        <th>Property</th>
        <th>${a.symbol} (#${a.z})</th>
        <th>${b.symbol} (#${b.z})</th>
      </tr>
    </thead>
    <tbody>
      ${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}
    </tbody>
  `;
}

function handleTileKeydown(e, pos) {
  const moves = {
    ArrowRight: [0, 1],
    ArrowLeft: [0, -1],
    ArrowDown: [1, 0],
    ArrowUp: [-1, 0]
  };
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    const z = gridCoords.get(`${pos.row},${pos.col}`);
    playElementNote(z);
    selectElement(z, true);
    return;
  }
  if (!moves[e.key]) return;
  e.preventDefault();

  let [dr, dc] = moves[e.key];
  let r = pos.row + dr;
  let c = pos.col + dc;

  while (r >= 2 && r <= 11 && c >= 2 && c <= 19) {
    const targetZ = gridCoords.get(`${r},${c}`);
    if (targetZ) {
      const targetTile = tileMap.get(targetZ);
      targetTile.focus();
      playElementNote(targetZ, "32n");
      state.highlightedShell = null;
      selectElement(targetZ, false);
      return;
    }
    r += dr;
    c += dc;
  }
}

function updateTempDisplay() {
  document.getElementById("tempReadout").textContent = formatTemp(state.tempK);
  renderTiles();
  selectElement(state.selectedZ, false);
}

// Event Listeners
document.getElementById("searchInput").addEventListener("input", e => {
  state.search = e.target.value;
  renderTiles();
});

document.getElementById("trendSelect").addEventListener("change", e => {
  state.colorMode = e.target.value;
  playElementNote(12);
  renderTiles();
});

document.getElementById("tempSlider").addEventListener("input", e => {
  state.tempK = parseInt(e.target.value, 10);
  updateTempDisplay();
});

document.getElementById("tempUnit").addEventListener("change", e => {
  state.tempUnit = e.target.value;
  updateTempDisplay();
});

document.getElementById("stpBtn").addEventListener("click", () => {
  state.tempK = 298;
  document.getElementById("tempSlider").value = 298;
  playElementNote(8);
  updateTempDisplay();
});

document.getElementById("bohrFocusBtn").addEventListener("click", e => {
  state.bohrFocus = !state.bohrFocus;
  document.body.classList.toggle("bohr-focus", state.bohrFocus);
  e.target.classList.toggle("active", state.bohrFocus);
  playElementNote(18);
});

document.getElementById("soundToggleBtn").addEventListener("click", e => {
  state.soundEnabled = !state.soundEnabled;
  e.target.classList.toggle("active", state.soundEnabled);
  e.target.textContent = state.soundEnabled ? "🔊 Sound" : "🔇 Muted";
  if (state.soundEnabled) playElementNote(10);
});

document.getElementById("waveBtn").addEventListener("click", () => {
  triggerWaveBounce(5, 10);
});

document.getElementById("insBadge").addEventListener("click", ev => {
  const el = ELEMENTS[state.selectedZ - 1];
  spawnSparkles(ev.clientX, ev.clientY, CATEGORIES[el.category].color);
  playElementNote(el.z, "8n");
});

document.getElementById("toggleOrbitBtn").addEventListener("click", e => {
  state.bohrPaused = !state.bohrPaused;
  e.target.textContent = state.bohrPaused ? "Play" : "Pause";
  renderBohrModel(ELEMENTS[state.selectedZ - 1]);
});

document.getElementById("boostOrbitBtn").addEventListener("click", e => {
  state.orbitSpeedMultiplier = state.orbitSpeedMultiplier === 1 ? 3.5 : 1;
  e.target.classList.toggle("active", state.orbitSpeedMultiplier > 1);
  playElementNote(state.selectedZ + 7);
  renderBohrModel(ELEMENTS[state.selectedZ - 1]);
});

document.getElementById("compareBtn").addEventListener("click", () => {
  state.compareZ = state.compareZ === state.selectedZ ? null : state.selectedZ;
  playElementNote(14);
  selectElement(state.selectedZ, false);
});

document.getElementById("clearCompare").addEventListener("click", () => {
  state.compareZ = null;
  selectElement(state.selectedZ, false);
});

document.getElementById("closeInspector").addEventListener("click", () => {
  document.getElementById("inspector").classList.add("closed");
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    document.getElementById("inspector").classList.add("closed");
  }
});

// Initialize
buildFilterChips();
buildGrid();
selectElement(1, true);
</script>
